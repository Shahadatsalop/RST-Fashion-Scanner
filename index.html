<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RST Fashion Point Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    select {
      width: 100%;
      max-width: 400px;
      padding: 13px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 15px;
    }

    #reader {
      width: 100%;
      max-width: 400px;
      margin: auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<h2>RST Fashion Point</h2>

<select id="salesperson">
  <option value="">Select Salesperson</option>
  <option value="Rafiqul Islam">Rafiqul Islam</option>
  <option value="Shahadat Hossain">Shahadat Hossain</option>
  <option value="Tamim Khan">Tamim Khan</option>
</select>

<div id="reader"></div>

<div id="result">
  Barcode Scan করুন
</div>

<script>

function onScanSuccess(decodedText) {

  document.getElementById("result").innerHTML =
    "✅ Barcode: <b>" + decodedText + "</b>";

  console.log("Barcode:", decodedText);
}

function onScanFailure(error) {
  // Scan না হলে কিছু করার দরকার নেই
}

const scanner = new Html5Qrcode("reader");

scanner.start(
  { facingMode: "environment" },
  {
    fps: 10,
    qrbox: {
      width: 300,
      height: 120
    }
  },
  onScanSuccess,
  onScanFailure
).catch(function(error) {

  document.getElementById("result").innerHTML =
    "❌ Camera চালু করা যাচ্ছে না। Camera Permission দিন।";

  console.log(error);

});

</script>

</body>
</html>
